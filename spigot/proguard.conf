# ProGuard configuration for NextDungeon-Spigot — RENAME-ONLY, CONSERVATIVE SCOPE.
#
# This plugin is heavily reflection/serialization driven:
#   * the workflow system persists objects by fully-qualified class name
#     (InstanceSerializer writes getClass().getName() and reloads via Class.forName),
#   * Gson maps JSON keys directly to Java field names (no @SerializedName anywhere),
#   * Bukkit (@EventHandler), the @Command framework, the web editor (@BlocklyField +
#     a Reflections("fr.perrier.dungeons") classpath scan) and the Pidgin packet router
#     (getSimpleName() across jars) all resolve things by name.
#
# Strategy: obfuscate ONLY five clearly-internal packages and KEEP everything else. Because a
# comma-separated list of negated patterns is OR (so it keeps everything), we instead keep each
# non-whitelisted package explicitly. The ONLY packages left unkept — and therefore renamed —
# are: menu, manager, loot, monitoring, queue.
#
# ==> TO OBFUSCATE ANOTHER PACKAGE: delete its "-keep class ...<pkg>.** { *; }" line below.
# ==> Any NEW top-level package is renamed by default unless you add a -keep line for it.
# See spigot/pom.xml (profile "obfuscate") for how this file is wired into the build.

# --- Rename only: never shrink or optimize (would drop/rewire reflectively-used code). ---
-dontshrink
-dontoptimize

# Preserve the metadata Gson / annotations / generics / stack maps rely on.
-keepattributes *Annotation*,Signature,EnclosingMethod,InnerClasses,RuntimeVisibleAnnotations,RuntimeVisibleParameterAnnotations,Exceptions,SourceFile,LineNumberTable
-renamesourcefileattribute SourceFile

# Provided server + external APIs (Spigot, MMOCore, packetevents, MythicMobs, CloudNet,
# NpcLib, WorldEdit, SimpleCloud…) are not all fully on the ProGuard library path — silence
# their notes/warnings so a missing provided class never fails a rename-only build.
-dontnote **
-dontwarn **

# --- Keep all libraries (every non-project class), names and members intact. ---
# NOTE: scope this to our own code only (fr.perrier.dungeons.**). Shaded libraries such as
# CupCodeAPI live under fr.perrier.cupcodeapi, so a broader !fr.perrier.** would have left
# them OUT of this keep and obfuscated them — breaking the reflective command/menu framework.
-keep class !fr.perrier.dungeons.** { *; }

# --- Keep the entire common module (Gson DTOs, Serializable packets, module SPI, enums). ---
-keep class fr.perrier.dungeons.common.** { *; }

# --- Keep the spigot root-level classes (Main is named by plugin.yml). ---
-keep class fr.perrier.dungeons.spigot.* { *; }

# --- Keep every spigot subpackage EXCEPT the five obfuscated ones (menu, manager, loot,
#     monitoring, queue). Deleting a line below opts that package into obfuscation. ---
-keep class fr.perrier.dungeons.spigot.api.** { *; }
-keep class fr.perrier.dungeons.spigot.commands.** { *; }
-keep class fr.perrier.dungeons.spigot.configuration.** { *; }
-keep class fr.perrier.dungeons.spigot.database.** { *; }
-keep class fr.perrier.dungeons.spigot.event.** { *; }
-keep class fr.perrier.dungeons.spigot.instance.** { *; }
-keep class fr.perrier.dungeons.spigot.listener.** { *; }
-keep class fr.perrier.dungeons.spigot.messaging.** { *; }
-keep class fr.perrier.dungeons.spigot.model.** { *; }
-keep class fr.perrier.dungeons.spigot.module.** { *; }
-keep class fr.perrier.dungeons.spigot.parties.** { *; }
-keep class fr.perrier.dungeons.spigot.storage.** { *; }
-keep class fr.perrier.dungeons.spigot.utils.** { *; }
-keep class fr.perrier.dungeons.spigot.webeditor.** { *; }
-keep class fr.perrier.dungeons.spigot.workflow.** { *; }

# --- Enums INSIDE the obfuscated packages that are resolved by constant name via valueOf()
#     from kept code — their constant names must survive, so keep the enums whole. Their
#     surrounding package classes are still obfuscated. ---
-keep enum fr.perrier.dungeons.spigot.loot.LootMode { *; }
-keep enum fr.perrier.dungeons.spigot.queue.NotificationType { *; }

# --- Safety nets (harmless: the whitelisted packages contain none of these) ---
# Never rename Bukkit event handlers, even if a renamed class ever implements Listener.
-keepclassmembers class * { @org.bukkit.event.EventHandler <methods>; }
