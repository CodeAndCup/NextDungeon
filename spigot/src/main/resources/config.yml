RedisConfiguration:
    host: "127.0.0.1"
    port: 6379
    username: "default"
    password: ""
    topic: "dungeons:packets" #Don't change or know what you're doing

DatabaseConfiguration:
    type: "mysql" #Supported types: mongodb, mysql

    mysql:
        host: "localhost"
        port: 3306
        database: "dungeons"
        username: "root"
        password: "root"

    mongodb:
        host: "localhost"
        port: 27017
        database: "dungeons"

webeditor:
    # Nom unique de ce serveur (auto-généré si vide)
    # Format recommandé: spigot-lobby, spigot-dungeon1, etc.
    server-name: ""

    # Adresse du proxy BungeeCord hébergeant le serveur web
    proxy-host: "localhost"

    # Port WebSocket du proxy BungeeCord
    proxy-port: 8081

    # Connexion automatique au démarrage
    auto-connect: true

    # Retry automatique en cas de déconnexion
    auto-retry: true

ServerConfiguration:
    isLobby: true